name: "Release"

on:
    push:
        branches: [ main ]

jobs:
    check:
        name: Check
        uses: hexadrop/github-workflows/.github/workflows/check.yml@v1
        with:
            commands: '["lint:ci", "typecheck", "test"]'
            cache-commands: '["lint:ci"]'

    publish:
        name: Publish
        needs: [ check ]
        runs-on: ubuntu-latest
        concurrency:
            group: release-main
            cancel-in-progress: false
        permissions:
            contents: 'write'
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup bun
                uses: oven-sh/setup-bun@v2
                with:
                    bun-version: latest

            -   name: Install dependencies
                run: bun install --frozen-lockfile

            -   name: Rebuild bundle
                run: bun run build

            -   name: Check bundle is up to date
                id: bundle
                run: |
                    if git diff --quiet dist/index.js; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                    else
                      git config user.name "github-actions[bot]"
                      git config user.email "github-actions[bot]@users.noreply.github.com"
                      git add dist/index.js
                      git commit -m "chore: rebuild dist"
                      git push
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Read version
                id: version
                run: |
                    version="$(jq -r '.version' package.json)"
                    major="${version%%.*}"
                    echo "semver=$version" >> "$GITHUB_OUTPUT"
                    echo "major=v$major" >> "$GITHUB_OUTPUT"

            -   name: Tag semver and major
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    version="${{ steps.version.outputs.semver }}"
                    major="${{ steps.version.outputs.major }}"

                    # Create or move semver tag
                    git tag -f "v$version" -m "Release v$version"
                    git push -f origin "v$version"

                    # Move major tag
                    git tag -f "$major" -m "Release $major"
                    git push -f origin "$major"

            -   name: Create GitHub Release
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    version="${{ steps.version.outputs.semver }}"
                    major="${{ steps.version.outputs.major }}"

                    gh release create "v$version" \
                      --title "v$version" \
                      --generate-notes \
                      --latest

                    gh release edit "$major" --title "$major" 2>/dev/null || true
