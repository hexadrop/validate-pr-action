name: "Release: beta"

on:
    push:
        branches: [ develop ]
        paths:
            - '.changeset/**'

jobs:
    check:
        name: Check
        uses: hexadrop/github-workflows/.github/workflows/check.yml@v1
        with:
            commands: '["lint:ci", "typecheck", "test"]'
            cache-commands: '["lint:ci"]'

    publish:
        name: Publish beta
        needs: [ check ]
        runs-on: ubuntu-latest
        concurrency:
            group: release-beta
            cancel-in-progress: false
        permissions:
            contents: 'write'
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup bun
                uses: oven-sh/setup-bun@v2
                with:
                    bun-version: latest

            -   name: Install dependencies
                run: bun install --frozen-lockfile

            -   name: Generate beta snapshot version
                id: beta
                run: |
                    bun changeset version --snapshot beta
                    version="$(jq -r '.version' package.json)"
                    echo "semver=$version" >> "$GITHUB_OUTPUT"
                    # Restore the snapshot version so it does not persist on the branch
                    git checkout -- package.json CHANGELOG.md 2>/dev/null || git checkout -- package.json

            -   name: Rebuild bundle
                run: bun run build

            -   name: Tag beta
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    version="${{ steps.beta.outputs.semver }}"
                    git tag -f "v$version" -m "Beta v$version"
                    git push -f origin "v$version"

            -   name: Create GitHub Pre-release
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    version="${{ steps.beta.outputs.semver }}"
                    gh release create "v$version" \
                      --title "v$version" \
                      --generate-notes \
                      --prerelease
